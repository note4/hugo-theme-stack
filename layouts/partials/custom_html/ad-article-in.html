{{/* 仅当 client 和 article_in_slot 都存在，且 ad_article_in 不为 false 时才显示 */}}
{{ if and (and .Site.Params.adsense (ne .Site.Params.adsense.client "")) (and (ne .Site.Params.adsense.article_in_slot "") (default true .Params.ad_article_in)) }}
<ins class="adsbygoogle"
     style="display:block; text-align:center;"
     data-ad-layout="in-article"
     data-ad-format="fluid"
     data-ad-client="{{ .Site.Params.adsense.client }}"
     data-ad-slot="{{ .Site.Params.adsense.article_in_slot }}"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
{{ end }}
