{{/* 仅当 client 和 bottom_slot 都存在，且 ad_bottom 不为 false 时才显示 */}}
{{ if and (and .Site.Params.adsense (ne .Site.Params.adsense.client "")) (and (ne .Site.Params.adsense.bottom_slot "") (default true .Params.ad_bottom)) }}
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="{{ .Site.Params.adsense.client }}"
     data-ad-slot="{{ .Site.Params.adsense.bottom_slot }}"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
{{ end }}
